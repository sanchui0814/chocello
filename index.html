<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chocello Games</title>
    <meta name="description" content="Support, privacy, and terms for apps from Chocello Games." />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f0e8;
        --text: #2a1810;
        --muted: #6b5346;
        --line: #e0d2c4;
        --accent: #8b4518;
        --card: #fffaf4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1210;
          --text: #f3e6d8;
          --muted: #b8a090;
          --line: #3a2a22;
          --accent: #e8b88a;
          --card: #241814;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
      }
      h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 0.35rem; }
      .meta { color: var(--muted); margin: 0 0 2rem; }
      article {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1.15rem 1.2rem 1.25rem;
      }
      article h2 { font-size: 1.15rem; margin: 0 0 0.35rem; }
      article p { margin: 0 0 0.85rem; }
      .links { display: flex; flex-wrap: wrap; gap: 0.75rem 1.1rem; }
      a { color: var(--accent); }
      footer {
        margin-top: 3rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Chocello Games</h1>
      <p class="meta">App support, privacy policies, and terms of use.</p>

      <article>
        <h2>Cocoa Boom</h2>
        <p>
          A free, offline chocolate block puzzle for Android. Drag pieces, clear lines, chase
          your best score. No ads, no in-app purchases, no account.
        </p>
        <div class="links">
          <a href="cocoaboom/support.html">Support</a>
          <a href="cocoaboom/privacy.html">Privacy Policy</a>
          <a href="cocoaboom/terms.html">Terms of Use</a>
        </div>
      </article>

      <footer>© 2026 Chocello Games</footer>
    </main>
  </body>
</html>
